<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Agent Runtime Console - 多智能体运行观测平台</title>
  <style>
    :root {
      color-scheme: light;
      --sidebar: #151c24;
      --sidebar-2: #1d2731;
      --canvas: #eef2f5;
      --surface: #ffffff;
      --surface-2: #f7f9fa;
      --line: #dce3e8;
      --line-strong: #c8d2d9;
      --text: #18232c;
      --muted: #667580;
      --faint: #94a1aa;
      --teal: #14858b;
      --teal-soft: #e1f3f3;
      --green: #2f8a4b;
      --green-soft: #e7f4eb;
      --amber: #b97808;
      --amber-soft: #fff2d8;
      --red: #c4473d;
      --red-soft: #fde9e7;
      --blue: #3478c8;
      --blue-soft: #e8f1fb;
      --purple: #7552b8;
      --purple-soft: #eee8f8;
      --shadow: 0 8px 24px rgba(21, 36, 48, .12);
      --mono: "Cascadia Mono", "SFMono-Regular", Consolas, monospace;
    }

    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; }
    body {
      background: var(--canvas);
      color: var(--text);
      font: 14px/1.5 "Segoe UI", "Microsoft YaHei", Arial, sans-serif;
      letter-spacing: 0;
      overflow: hidden;
    }
    button, input, select, textarea { font: inherit; letter-spacing: 0; }
    button { cursor: pointer; }
    .mono { font-family: var(--mono); }
    .muted { color: var(--muted); }
    .faint { color: var(--faint); }
    .truncate { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

    .app { min-height: 100vh; }
    .sidebar {
      position: fixed; inset: 0 auto 0 0; z-index: 30;
      width: 232px; background: var(--sidebar); color: #dfe7ed;
      display: flex; flex-direction: column; border-right: 1px solid #26313c;
    }
    .brand {
      height: 64px; display: flex; align-items: center; gap: 11px;
      padding: 0 18px; border-bottom: 1px solid #2a3540;
    }
    .brand-mark {
      width: 32px; height: 32px; border: 1px solid #3bb0b4; color: #55c3c6;
      display: grid; place-items: center; border-radius: 7px; font-weight: 800;
    }
    .brand-title { font-weight: 700; font-size: 15px; color: #fff; }
    .brand-sub { font-size: 11px; color: #83929e; }
    .nav-section { padding: 16px 10px 8px; }
    .nav-caption { padding: 0 10px 8px; color: #71808d; font-size: 11px; text-transform: uppercase; }
    .nav-button {
      width: 100%; min-height: 40px; border: 0; border-radius: 6px;
      color: #aebbc5; background: transparent; display: flex; align-items: center;
      gap: 11px; padding: 0 11px; text-align: left; margin-bottom: 3px;
    }
    .nav-button:hover { color: #fff; background: #222e39; }
    .nav-button.active { color: #fff; background: #263640; box-shadow: inset 3px 0 var(--teal); }
    .nav-icon { width: 22px; text-align: center; color: #72bfc2; font: 16px var(--mono); }
    .nav-badge { margin-left: auto; min-width: 20px; padding: 1px 6px; border-radius: 9px; background: #33414d; font-size: 11px; text-align: center; }
    .sidebar-footer { margin-top: auto; padding: 14px; border-top: 1px solid #2a3540; }
    .system-health { display: flex; gap: 9px; align-items: center; color: #9eabb5; font-size: 12px; }
    .health-dot { width: 8px; height: 8px; border-radius: 50%; background: #4eae69; box-shadow: 0 0 0 3px rgba(78,174,105,.12); }

    .topbar {
      position: fixed; left: 232px; right: 0; top: 0; z-index: 25; height: 56px;
      background: rgba(255,255,255,.97); border-bottom: 1px solid var(--line);
      display: flex; align-items: center; justify-content: space-between; padding: 0 18px;
    }
    .top-left, .top-right { display: flex; align-items: center; gap: 10px; min-width: 0; }
    .mobile-menu { display: none; }
    .env-select, .range-select, .filter-select, .field {
      height: 34px; border: 1px solid var(--line-strong); border-radius: 6px;
      background: #fff; color: var(--text); padding: 0 10px; outline: none;
    }
    .env-select { font-family: var(--mono); }
    .global-search {
      width: 300px; height: 34px; border: 1px solid var(--line); border-radius: 6px;
      background: var(--surface-2); padding: 0 11px; outline: none;
    }
    .global-search:focus, .field:focus, .filter-select:focus { border-color: var(--teal); box-shadow: 0 0 0 2px rgba(20,133,139,.1); }
    .health-chip { height: 30px; display: inline-flex; align-items: center; gap: 7px; padding: 0 10px; border: 1px solid #badac4; color: var(--green); background: var(--green-soft); border-radius: 15px; font-size: 12px; }
    .primary-btn, .secondary-btn, .icon-btn, .ghost-btn, .danger-btn {
      min-height: 34px; border-radius: 6px; border: 1px solid transparent; padding: 0 12px; display: inline-flex; align-items: center; justify-content: center; gap: 7px;
    }
    .primary-btn { color: #fff; background: var(--teal); border-color: var(--teal); }
    .primary-btn:hover { background: #0e7479; }
    .secondary-btn, .icon-btn { color: var(--text); background: #fff; border-color: var(--line-strong); }
    .secondary-btn:hover, .icon-btn:hover { background: var(--surface-2); }
    .ghost-btn { color: var(--muted); background: transparent; }
    .danger-btn { color: var(--red); background: var(--red-soft); border-color: #efc1bd; }
    .icon-btn { width: 34px; padding: 0; font: 17px var(--mono); }

    .main { position: fixed; left: 232px; top: 56px; right: 0; bottom: 0; overflow: auto; }
    .view { min-height: 100%; padding: 18px; }
    .page-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 16px; margin-bottom: 16px; }
    .page-title { margin: 0; font-size: 21px; line-height: 1.3; }
    .page-desc { margin-top: 4px; color: var(--muted); font-size: 13px; }
    .page-actions { display: flex; gap: 8px; flex-wrap: wrap; }

    .metrics-strip { display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); background: var(--surface); border: 1px solid var(--line); border-radius: 8px; margin-bottom: 14px; }
    .metric { padding: 14px 16px; min-width: 0; border-right: 1px solid var(--line); }
    .metric:last-child { border-right: 0; }
    .metric-label { color: var(--muted); font-size: 12px; margin-bottom: 6px; }
    .metric-value { font-size: 25px; line-height: 1.2; font-weight: 700; }
    .metric-foot { margin-top: 5px; font-size: 11px; color: var(--faint); }
    .metric-up { color: var(--green); }
    .metric-down { color: var(--red); }

    .dashboard-grid { display: grid; grid-template-columns: minmax(0, 1.5fr) minmax(280px, .72fr) minmax(300px, .85fr); gap: 14px; }
    .panel { background: var(--surface); border: 1px solid var(--line); border-radius: 8px; min-width: 0; }
    .panel.span-2 { grid-column: span 2; }
    .panel-head { min-height: 45px; padding: 0 14px; display: flex; align-items: center; justify-content: space-between; gap: 12px; border-bottom: 1px solid var(--line); }
    .panel-title { font-size: 14px; font-weight: 700; }
    .panel-meta { color: var(--faint); font-size: 11px; }
    .panel-body { padding: 14px; }
    .trend-svg { width: 100%; height: 230px; display: block; }
    .grid-line { stroke: #e7ecef; stroke-width: 1; }
    .trend-line { fill: none; stroke: var(--teal); stroke-width: 2.5; }
    .trend-area { fill: rgba(20,133,139,.09); }
    .trend-point { fill: #fff; stroke: var(--teal); stroke-width: 2; }
    .axis-label { fill: #84919b; font-size: 11px; }
    .donut-row { display: flex; align-items: center; gap: 22px; padding: 8px 4px; }
    .donut { width: 132px; height: 132px; border-radius: 50%; background: conic-gradient(var(--green) 0 62%, var(--amber) 62% 76%, var(--red) 76% 86%, #9aa7b0 86% 100%); position: relative; flex: 0 0 auto; }
    .donut::after { content: ""; position: absolute; inset: 25px; background: #fff; border-radius: 50%; }
    .donut-center { position: absolute; inset: 0; z-index: 1; display: grid; place-content: center; text-align: center; font-weight: 700; }
    .legend { display: grid; gap: 8px; width: 100%; }
    .legend-item { display: flex; align-items: center; gap: 8px; color: var(--muted); }
    .legend-item strong { margin-left: auto; color: var(--text); }
    .legend-dot { width: 8px; height: 8px; border-radius: 50%; }
    .bar-list { display: grid; gap: 12px; }
    .bar-row { display: grid; grid-template-columns: 112px 1fr 48px; gap: 10px; align-items: center; font-size: 12px; }
    .bar-track { height: 7px; border-radius: 4px; background: #e8edf0; overflow: hidden; }
    .bar-fill { height: 100%; background: var(--teal); border-radius: 4px; }
    .tier-track { display: flex; height: 14px; overflow: hidden; border-radius: 4px; background: #e9eef1; margin: 12px 0 14px; }
    .tier-hot { background: var(--red); } .tier-warm { background: var(--amber); } .tier-cold { background: var(--blue); } .tier-tomb { background: #8996a0; }

    .dense-list { display: grid; }
    .dense-item { min-height: 50px; padding: 9px 14px; display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 10px; align-items: center; border-bottom: 1px solid var(--line); cursor: pointer; }
    .dense-item:last-child { border-bottom: 0; }
    .dense-item:hover { background: var(--surface-2); }
    .severity { width: 4px; height: 30px; border-radius: 2px; background: var(--amber); }
    .severity.error { background: var(--red); }
    .severity.info { background: var(--blue); }
    .dense-title { font-weight: 600; font-size: 13px; }
    .dense-sub { color: var(--muted); font-size: 11px; }

    .toolbar { min-height: 52px; background: var(--surface); border: 1px solid var(--line); border-radius: 8px 8px 0 0; display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 8px 10px; }
    .toolbar-group { display: flex; align-items: center; gap: 8px; min-width: 0; flex-wrap: wrap; }
    .table-wrap { background: var(--surface); border: 1px solid var(--line); border-top: 0; border-radius: 0 0 8px 8px; overflow: auto; }
    table { width: 100%; border-collapse: collapse; min-width: 1000px; }
    th { position: sticky; top: 0; z-index: 2; height: 40px; padding: 0 11px; background: #f5f7f8; color: #53626d; font-size: 11px; text-align: left; white-space: nowrap; border-bottom: 1px solid var(--line-strong); }
    th.sortable { cursor: pointer; }
    th.sortable:hover { color: var(--teal); }
    td { height: 48px; padding: 7px 11px; border-bottom: 1px solid var(--line); vertical-align: middle; }
    tbody tr { cursor: pointer; }
    tbody tr:hover { background: #f4f9f9; }
    .question-cell { max-width: 410px; font-weight: 600; }
    .status-pill { display: inline-flex; align-items: center; gap: 6px; height: 23px; padding: 0 8px; border-radius: 12px; font-size: 11px; white-space: nowrap; }
    .status-success { color: var(--green); background: var(--green-soft); }
    .status-running { color: var(--amber); background: var(--amber-soft); }
    .status-failed { color: var(--red); background: var(--red-soft); }
    .status-waiting, .status-stopped { color: #63717b; background: #edf1f3; }
    .status-dot { width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
    .progress { width: 90px; height: 5px; background: #e7ecef; border-radius: 3px; overflow: hidden; }
    .progress > span { display: block; height: 100%; background: var(--teal); }
    .mode-tag { font: 11px var(--mono); color: var(--purple); background: var(--purple-soft); border-radius: 4px; padding: 3px 6px; }
    .mode-tag.baseline { color: var(--blue); background: var(--blue-soft); }

    .workflow-view { padding: 0; overflow: hidden; height: 100%; }
    .workflow-header { background: var(--surface); border-bottom: 1px solid var(--line); padding: 13px 16px 11px; }
    .breadcrumb { color: var(--muted); font-size: 12px; margin-bottom: 8px; }
    .breadcrumb button { border: 0; background: none; color: var(--teal); padding: 0; }
    .workflow-title-row { display: flex; justify-content: space-between; gap: 18px; align-items: flex-start; }
    .workflow-question { font-size: 16px; font-weight: 700; max-width: 850px; }
    .workflow-meta { display: flex; gap: 20px; margin-top: 10px; color: var(--muted); font-size: 12px; flex-wrap: wrap; }
    .workflow-meta strong { color: var(--text); margin-left: 4px; }
    .segment { display: inline-flex; border: 1px solid var(--line-strong); border-radius: 6px; padding: 2px; background: var(--surface-2); }
    .segment button { min-height: 29px; padding: 0 11px; border: 0; border-radius: 4px; background: transparent; color: var(--muted); }
    .segment button.active { color: #fff; background: var(--teal); }
    .workflow-shell { height: calc(100vh - 183px); display: grid; grid-template-columns: 210px minmax(0, 1fr); }
    .workflow-aside { background: #f8fafb; border-right: 1px solid var(--line); overflow: auto; padding: 12px 10px; }
    .aside-title { font-size: 11px; color: var(--muted); text-transform: uppercase; padding: 5px 7px 8px; }
    .aside-agent { border: 0; width: 100%; min-height: 39px; border-radius: 5px; background: transparent; text-align: left; display: flex; align-items: center; gap: 8px; padding: 6px 7px; color: var(--text); }
    .aside-agent:hover { background: #edf3f5; }
    .aside-agent .mini-status { width: 7px; height: 7px; border-radius: 50%; background: var(--green); }
    .aside-stat { display: flex; justify-content: space-between; padding: 6px 7px; color: var(--muted); font-size: 12px; }
    .aside-stat strong { color: var(--text); }
    .canvas-wrap { position: relative; min-width: 0; background: #eaf0f3; overflow: hidden; }
    .workflow-viewport { position: absolute; inset: 0; cursor: grab; overflow: hidden; background-image: radial-gradient(#cbd5dc 1px, transparent 1px); background-size: 20px 20px; }
    .workflow-viewport.dragging { cursor: grabbing; }
    .workflow-stage { position: absolute; width: 1400px; height: 900px; transform-origin: 0 0; }
    .edge-layer { position: absolute; inset: 0; width: 1400px; height: 900px; overflow: visible; pointer-events: none; }
    .wf-edge { fill: none; stroke: #6c98ab; stroke-width: 1.6; marker-end: url(#arrow); }
    .wf-edge.running { stroke: var(--amber); stroke-dasharray: 7 5; animation: dash 1.6s linear infinite; }
    @keyframes dash { to { stroke-dashoffset: -24; } }
    .wf-node { position: absolute; z-index: 2; border: 1px solid; border-radius: 7px; background: #fff; box-shadow: 0 3px 8px rgba(43,64,77,.1); cursor: pointer; overflow: hidden; text-align: left; }
    .wf-node:hover, .wf-node.selected { box-shadow: 0 0 0 2px rgba(20,133,139,.2), 0 6px 16px rgba(43,64,77,.16); }
    .wf-node.agent { width: 220px; min-height: 88px; border-color: #5eaeb2; }
    .wf-node.agent .node-head { background: var(--teal); color: #fff; }
    .wf-node.start, .wf-node.final { width: 290px; min-height: 62px; border-color: #63a978; }
    .wf-node.start .node-head, .wf-node.final .node-head { background: var(--green); color: #fff; }
    .wf-node.payload { width: 150px; min-height: 55px; border-color: #7eabd7; clip-path: polygon(8px 0, 100% 0, 100% calc(100% - 8px), calc(100% - 8px) 100%, 0 100%, 0 8px); }
    .wf-node.payload .node-head { color: var(--blue); background: var(--blue-soft); }
    .wf-node.state { width: 150px; min-height: 55px; border-color: #e2ad52; }
    .wf-node.state .node-head { color: var(--amber); background: var(--amber-soft); }
    .wf-node.memory { width: 150px; min-height: 55px; border-color: #a68bd1; }
    .wf-node.memory .node-head { color: var(--purple); background: var(--purple-soft); }
    .wf-node.failed { border-color: var(--red); }
    .wf-node.failed .node-head { background: var(--red); color: #fff; }
    .node-head { min-height: 28px; padding: 5px 9px; display: flex; align-items: center; justify-content: space-between; gap: 8px; font-size: 11px; font-weight: 700; }
    .node-body { padding: 7px 9px; }
    .node-title { font-weight: 700; font-size: 13px; }
    .node-summary { color: var(--muted); font-size: 11px; margin-top: 2px; line-height: 1.35; }
    .node-foot { display: flex; gap: 8px; margin-top: 5px; color: var(--faint); font-size: 10px; }
    .canvas-controls { position: absolute; right: 14px; top: 14px; z-index: 6; display: flex; gap: 4px; padding: 4px; border: 1px solid var(--line); border-radius: 7px; background: rgba(255,255,255,.95); box-shadow: var(--shadow); }
    .canvas-controls button { width: 31px; height: 31px; border: 0; background: transparent; color: var(--text); border-radius: 4px; font: 16px var(--mono); }
    .canvas-controls button:hover { background: var(--surface-2); }
    .canvas-legend { position: absolute; left: 14px; bottom: 14px; z-index: 6; display: flex; gap: 12px; padding: 7px 10px; border: 1px solid var(--line); border-radius: 6px; background: rgba(255,255,255,.94); color: var(--muted); font-size: 10px; }
    .legend-shape { width: 10px; height: 10px; border: 1px solid; display: inline-block; margin-right: 4px; vertical-align: -1px; }
    .minimap { position: absolute; right: 14px; bottom: 14px; z-index: 6; width: 168px; height: 108px; border: 1px solid var(--line-strong); background: rgba(255,255,255,.94); border-radius: 6px; overflow: hidden; }
    .minimap-node { position: absolute; border-radius: 2px; background: #76aeb1; min-width: 8px; min-height: 5px; }
    .minimap-node.payload { background: #82a9d2; } .minimap-node.state { background: #d9a84f; } .minimap-node.memory { background: #9e86c7; }

    .pool-summary { display: grid; grid-template-columns: repeat(4, minmax(0,1fr)); border: 1px solid var(--line); border-radius: 8px; background: var(--surface); margin-bottom: 14px; }
    .pool-tier { padding: 14px 16px; border-right: 1px solid var(--line); }
    .pool-tier:last-child { border-right: 0; }
    .pool-tier-row { display: flex; align-items: center; justify-content: space-between; }
    .pool-tier strong { font-size: 23px; }
    .pool-dot { width: 9px; height: 9px; border-radius: 2px; }
    .memory-layout { display: grid; grid-template-columns: minmax(0,1fr) 260px; gap: 14px; }
    .memory-canvas { height: calc(100vh - 190px); min-height: 570px; position: relative; overflow: hidden; background-color: #f7f9fa; background-image: radial-gradient(#d8e0e5 1px, transparent 1px); background-size: 20px 20px; }
    .memory-stage { position: absolute; width: 900px; height: 680px; left: 50%; top: 20px; transform: translateX(-50%); transform-origin: top center; }
    .memory-edge-layer { position: absolute; inset: 0; width: 900px; height: 680px; }
    .memory-edge { stroke: #abb7c0; stroke-width: 1.3; fill: none; }
    .memory-node { position: absolute; width: 116px; min-height: 48px; padding: 7px; border: 1px solid; border-radius: 7px; background: #fff; text-align: center; cursor: pointer; box-shadow: 0 2px 7px rgba(40,58,70,.1); font-size: 11px; }
    .memory-node:hover { box-shadow: 0 0 0 2px rgba(117,82,184,.18); }
    .memory-node.view { border-color: var(--teal); background: var(--teal-soft); }
    .memory-node.claim { border-color: var(--amber); background: var(--amber-soft); }
    .memory-node.promotion { border-color: var(--purple); background: var(--purple-soft); }
    .memory-node.object { border-color: var(--blue); background: var(--blue-soft); }
    .memory-node.candidate { border-style: dashed; border-color: #8996a0; }
    .memory-node.stateobj { border-color: var(--red); background: var(--red-soft); }
    .memory-side { display: grid; gap: 14px; align-content: start; }
    .type-list { padding: 7px 0; }
    .type-item { display: flex; align-items: center; gap: 8px; padding: 7px 12px; color: var(--muted); font-size: 12px; }
    .type-item strong { margin-left: auto; color: var(--text); }

    .drawer-backdrop { position: fixed; inset: 0; z-index: 80; background: rgba(16,24,31,.44); opacity: 0; pointer-events: none; transition: opacity .18s; }
    .drawer-backdrop.open { opacity: 1; pointer-events: auto; }
    .drawer { position: fixed; z-index: 90; right: 0; top: 0; bottom: 0; width: 520px; max-width: 100%; background: var(--surface); box-shadow: -12px 0 30px rgba(20,31,39,.16); transform: translateX(100%); transition: transform .2s; display: flex; flex-direction: column; }
    .drawer.open { transform: translateX(0); }
    .drawer-head { min-height: 60px; padding: 10px 15px; border-bottom: 1px solid var(--line); display: flex; align-items: center; justify-content: space-between; gap: 12px; }
    .drawer-title { font-weight: 700; }
    .drawer-sub { color: var(--muted); font-size: 11px; }
    .drawer-tabs { display: flex; gap: 2px; padding: 0 12px; border-bottom: 1px solid var(--line); overflow-x: auto; }
    .drawer-tab { min-height: 39px; padding: 0 10px; white-space: nowrap; border: 0; border-bottom: 2px solid transparent; background: none; color: var(--muted); }
    .drawer-tab.active { color: var(--teal); border-bottom-color: var(--teal); }
    .drawer-body { flex: 1; overflow: auto; padding: 14px; }
    .detail-grid { display: grid; grid-template-columns: 130px minmax(0,1fr); border: 1px solid var(--line); border-bottom: 0; }
    .detail-key, .detail-value { padding: 8px 10px; border-bottom: 1px solid var(--line); }
    .detail-key { background: #f6f8f9; color: var(--muted); }
    .detail-value { overflow-wrap: anywhere; }
    .code-block { margin: 0; padding: 12px; border: 1px solid var(--line); border-radius: 6px; background: #f5f7f8; color: #26343d; white-space: pre-wrap; overflow-wrap: anywhere; font: 12px/1.55 var(--mono); max-height: 62vh; overflow: auto; }
    .log-line { display: grid; grid-template-columns: 76px 52px 1fr; gap: 8px; padding: 5px 0; border-bottom: 1px solid #edf1f3; font: 11px/1.45 var(--mono); }
    .log-level.warn { color: var(--amber); } .log-level.error { color: var(--red); } .log-level.info { color: var(--blue); }

    .modal-backdrop { position: fixed; inset: 0; z-index: 100; display: none; place-items: center; padding: 18px; background: rgba(16,24,31,.48); }
    .modal-backdrop.open { display: grid; }
    .modal { width: 620px; max-width: 100%; background: #fff; border-radius: 8px; box-shadow: var(--shadow); }

    const baselineNodes = [

    const appState = {view:"dashboard", selectedTask:tasks[0].id, workflowMode:"runtime_lite", taskQuery:"", taskStatus:"all", taskMode:"all", sortKey:"startedAt", sortDir:"desc", zoom:0.82, panX:80, panY:10, drawer:null, drawerTab:"overview"};
    const root = document.getElementById("viewRoot");

    function esc(value){return String(value??"").replaceAll("&","&amp;").replaceAll("<","&lt;").replaceAll(">","&gt;").replaceAll('"',"&quot;").replaceAll("'","&#39;")}
    function fmtTokens(n){if(!n)return "0";return n>=1000?(n/1000).toFixed(n>=100000?0:1)+"k":String(n)}

    function renderDashboard(){

        <div class="panel span-2"><div class="panel-head"><span class="panel-title">任务运行趋势</span><span class="panel-meta">最近 7 天 · runtime_lite</span></div><div class="panel-body">${trendChart()}</div></div>
        <div class="panel"><div class="panel-head"><span class="panel-title">任务状态</span><span class="panel-meta">共 ${total} 个</span></div><div class="panel-body"><div class="donut-row"><div class="donut"><div class="donut-center">${success}<small>成功</small></div></div><div class="legend"><div class="legend-item"><span class="legend-dot" style="background:var(--green)"></span>成功<strong>${success}</strong></div><div class="legend-item"><span class="legend-dot" style="background:var(--amber)"></span>运行中<strong>1</strong></div><div class="legend-item"><span class="legend-dot" style="background:var(--red)"></span>失败<strong>1</strong></div><div class="legend-item"><span class="legend-dot" style="background:#9aa7b0"></span>其他<strong>2</strong></div></div></div></div></div>
        <div class="panel"><div class="panel-head"><span class="panel-title">Agent 调用排行</span><span class="panel-meta">调用量 / p95</span></div><div class="panel-body"><div class="bar-list">${agents.map((a,i)=>`<div class="bar-row"><span>${a.role.replace("Agent","")}</span><div class="bar-track"><div class="bar-fill" style="width:${a.calls/2.5}%"></div></div><span>${a.calls}</span></div>`).join("")}</div></div></div>
        <div class="panel"><div class="panel-head"><span class="panel-title">状态池占用</span><span class="panel-meta">54 objects · 382 MB</span></div><div class="panel-body"><div class="tier-track"><span class="tier-hot" style="width:18%"></span><span class="tier-warm" style="width:22%"></span><span class="tier-cold" style="width:52%"></span><span class="tier-tomb" style="width:8%"></span></div><div class="legend"><div class="legend-item"><span class="legend-dot tier-hot"></span>Hot<strong>10 · 42 MB</strong></div><div class="legend-item"><span class="legend-dot tier-warm"></span>Warm<strong>12 · 68 MB</strong></div><div class="legend-item"><span class="legend-dot tier-cold"></span>Cold<strong>28 · 272 MB</strong></div><div class="legend-item"><span class="legend-dot tier-tomb"></span>Tombstone<strong>4</strong></div></div></div></div>
        <div class="panel"><div class="panel-head"><span class="panel-title">最近告警</span><button class="ghost-btn" data-nav="alerts">全部告警</button></div><div class="dense-list">${alerts.slice(0,4).map(a=>denseAlert(a)).join("")}</div></div>
        <div class="panel span-2"><div class="panel-head"><span class="panel-title">最近任务</span><button class="ghost-btn" data-nav="tasks">任务列表</button></div><div class="table-wrap" style="border:0;border-radius:0"><table style="min-width:760px"><thead><tr><th>任务</th><th>模式</th><th>状态</th><th>耗时</th><th>Token</th><th>开始时间</th></tr></thead><tbody>${tasks.slice(0,5).map(t=>`<tr data-task-id="${t.id}"><td><div class="question-cell truncate">${esc(t.question)}</div><div class="dense-sub mono">${t.id}</div></td><td><span class="mode-tag ${t.mode.startsWith("baseline")?"baseline":""}">${t.mode}</span></td><td>${statusPill(t.status)}</td><td>${t.duration?t.duration+"s":"--"}</td><td>${fmtTokens(t.tokens)}</td><td>${t.startedAt}</td></tr>`).join("")}</tbody></table></div></div>
      </div></section>`
    }
    function metric(label,value,foot,cls=""){return `<div class="metric"><div class="metric-label">${label}</div><div class="metric-value">${value}</div><div class="metric-foot ${cls}">${foot}</div></div>`}
    function trendChart(){const vals=[14,17,15,22,26,24,31],pts=vals.map((v,i)=>`${35+i*110},${205-v*5}`).join(" ");return `<svg class="trend-svg" viewBox="0 0 720 240" preserveAspectRatio="none"><line class="grid-line" x1="35" y1="45" x2="695" y2="45"/><line class="grid-line" x1="35" y1="105" x2="695" y2="105"/><line class="grid-line" x1="35" y1="165" x2="695" y2="165"/><path class="trend-area" d="M ${pts.replaceAll(" "," L ")} L695 215 L35 215 Z"/><polyline class="trend-line" points="${pts}"/>${vals.map((v,i)=>`<circle class="trend-point" cx="${35+i*110}" cy="${205-v*5}" r="4"/><text class="axis-label" x="${35+i*110}" y="232" text-anchor="middle">06/${16+i}</text>`).join("")}<text class="axis-label" x="8" y="49">32</text><text class="axis-label" x="8" y="109">20</text><text class="axis-label" x="14" y="169">8</text></svg>`}
    function denseAlert(a){return `<div class="dense-item" data-alert-id="${a.id}"><span class="severity ${a.severity}"></span><div class="truncate"><div class="dense-title truncate">${esc(a.title)}</div><div class="dense-sub mono">${a.task} · ${a.source}</div></div><span class="dense-sub">${a.time}</span></div>`}

    function renderTasks(){const filtered=getFilteredTasks();return `<section class="view"><div class="page-head"><div><h1 class="page-title">任务实例</h1><div class="page-desc">检索实验问题、运行状态与协作成本</div></div><button class="primary-btn" data-action="new-experiment">＋ 新建实验</button></div>
      <div class="toolbar"><div class="toolbar-group"><input class="field" id="taskSearch" value="${esc(appState.taskQuery)}" placeholder="搜索问题或任务 ID..." style="width:290px"><select class="filter-select" id="taskStatus"><option value="all">全部状态</option>${Object.entries(statusText).map(([k,v])=>`<option value="${k}" ${appState.taskStatus===k?"selected":""}>${v}</option>`).join("")}</select><select class="filter-select" id="taskMode"><option value="all">全部模式</option><option value="runtime_lite" ${appState.taskMode==="runtime_lite"?"selected":""}>runtime_lite</option><option value="baseline_text" ${appState.taskMode==="baseline_text"?"selected":""}>baseline_text</option></select></div><span class="muted" id="taskSummary">${filtered.length} / ${tasks.length} 条</span></div>
      <div class="table-wrap"><table><thead><tr>${taskHead("id","任务 ID")}${taskHead("question","起始问题")}${taskHead("mode","模式")}${taskHead("status","状态")}<th>进度</th><th>Agent</th>${taskHead("duration","耗时")}${taskHead("tokens","Token")}<th>记忆命中</th>${taskHead("startedAt","开始时间")}</tr></thead><tbody id="taskRows">${filtered.map(taskRow).join("")||`<tr><td colspan="10" style="text-align:center;color:var(--muted);height:100px">没有符合筛选条件的任务</td></tr>`}</tbody></table></div></section>`}
    function taskHead(key,label){return `<th class="sortable" data-sort="${key}">${label}${appState.sortKey===key?(appState.sortDir==="asc"?" ↑":" ↓"):""}</th>`}
    function taskRow(t){return `<tr data-task-id="${t.id}"><td class="mono">${t.id}</td><td><div class="question-cell truncate" title="${esc(t.question)}">${esc(t.question)}</div><div class="dense-sub">${t.group}</div></td><td><span class="mode-tag ${t.mode.startsWith("baseline")?"baseline":""}">${t.mode}</span></td><td>${statusPill(t.status)}</td><td><div class="progress"><span style="width:${t.progress}%"></span></div><div class="dense-sub">${t.progress}%</div></td><td>${t.agents}</td><td>${t.duration?t.duration+"s":"--"}</td><td>${fmtTokens(t.tokens)}</td><td>${t.memoryHits}</td><td>${t.startedAt}</td></tr>`}
    function getFilteredTasks(){let result=tasks.filter(t=>(appState.taskStatus==="all"||t.status===appState.taskStatus)&&(appState.taskMode==="all"||t.mode===appState.taskMode)&&(`${t.id} ${t.question} ${t.group}`.toLowerCase().includes(appState.taskQuery.toLowerCase())));return result.sort((a,b)=>{let x=a[appState.sortKey],y=b[appState.sortKey];if(typeof x==="number")return appState.sortDir==="asc"?x-y:y-x;return appState.sortDir==="asc"?String(x).localeCompare(String(y),"zh-CN"):String(y).localeCompare(String(x),"zh-CN")})}
    function updateTaskTable(){const rows=document.getElementById("taskRows"),summary=document.getElementById("taskSummary");if(!rows||!summary)return;const filtered=getFilteredTasks();rows.innerHTML=filtered.map(taskRow).join("")||`<tr><td colspan="10" style="text-align:center;color:var(--muted);height:100px">没有符合筛选条件的任务</td></tr>`;summary.textContent=`${filtered.length} / ${tasks.length} 条`}

    function renderWorkflow(){const task=selectedTask(), runtime=appState.workflowMode==="runtime_lite", nodes=runtime?runtimeNodes:baselineNodes;return `<section class="workflow-view"><div class="workflow-header"><div class="breadcrumb"><button data-nav="tasks">任务实例</button> / <span class="mono">${task.id}</span></div><div class="workflow-title-row"><div><div class="workflow-question">${esc(task.question)}</div><div class="workflow-meta"><span>状态 ${statusPill(task.status)}</span><span>耗时<strong>${task.duration||"--"}s</strong></span><span>Token<strong>${fmtTokens(task.tokens)}</strong></span><span>Agent<strong>${task.agents}</strong></span><span>记忆命中<strong>${task.memoryHits}</strong></span></div></div><div class="segment"><button data-mode="runtime_lite" class="${runtime?"active":""}">runtime_lite</button><button data-mode="baseline_text" class="${!runtime?"active":""}">baseline_text</button></div></div></div>
      <div class="workflow-shell"><aside class="workflow-aside"><div class="aside-title">Agent 执行链</div>${nodes.filter(n=>n.type==="agent").map(n=>`<button class="aside-agent" data-node-id="${n.id}"><span class="mini-status"></span><span><strong>${n.label}</strong><br><span class="dense-sub">${n.metrics||"等待执行"}</span></span></button>`).join("")}<div class="aside-title" style="margin-top:14px">资源池快照</div><div class="aside-stat"><span>Hot State</span><strong>10</strong></div><div class="aside-stat"><span>Cold State</span><strong>28</strong></div><div class="aside-stat"><span>Memory View</span><strong>7</strong></div><div class="aside-stat"><span>Active Claim</span><strong>19</strong></div></aside>
      <div class="canvas-wrap"><div class="workflow-viewport" id="workflowViewport"><div class="workflow-stage" id="workflowStage"><svg class="edge-layer" id="wfEdges"><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#6c98ab"/></marker></defs></svg>${nodes.map(renderWorkflowNode).join("")}</div></div><div class="canvas-controls"><button data-canvas="zoom-out" title="缩小">−</button><button data-canvas="zoom-in" title="放大">＋</button><button data-canvas="fit" title="适配画布">□</button><button data-canvas="reset" title="重置">↺</button></div><div class="canvas-legend"><span><i class="legend-shape" style="border-color:var(--teal);background:var(--teal-soft)"></i>Agent</span><span><i class="legend-shape" style="border-color:var(--blue);background:var(--blue-soft)"></i>Message</span><span><i class="legend-shape" style="border-color:var(--amber);background:var(--amber-soft)"></i>State</span><span><i class="legend-shape" style="border-color:var(--purple);background:var(--purple-soft)"></i>Memory</span></div><div class="minimap">${nodes.map(n=>`<i class="minimap-node ${n.type}" style="left:${n.x*.115}px;top:${n.y*.115}px;width:${n.type==='agent'?25:16}px;height:${n.type==='agent'?10:7}px"></i>`).join("")}</div></div></div></section>`}
    function renderWorkflowNode(n){return `<button class="wf-node ${n.type} ${n.status==="failed"?"failed":""}" data-node-id="${n.id}" style="left:${n.x}px;top:${n.y}px"><div class="node-head"><span>${n.type==="agent"?"AGENT":n.type.toUpperCase()}</span><span>${n.status==="success"?"✓":n.status==="running"?"●":""}</span></div><div class="node-body"><div class="node-title">${esc(n.label)}</div><div class="node-summary">${esc(n.summary)}</div>${n.metrics?`<div class="node-foot"><span>${n.metrics}</span></div>`:""}</div></button>`}
    function workflowSet(){return appState.workflowMode==="runtime_lite"?{nodes:runtimeNodes,edges:runtimeEdges}:{nodes:baselineNodes,edges:baselineEdges}}
    function drawWorkflowEdges(){const svg=document.getElementById("wfEdges");if(!svg)return;svg.querySelectorAll(".wf-edge").forEach(e=>e.remove());const {edges}=workflowSet();edges.forEach(([a,b],i)=>{const from=document.querySelector(`[data-node-id="${a}"]`),to=document.querySelector(`[data-node-id="${b}"]`);if(!from||!to)return;const x1=from.offsetLeft+from.offsetWidth/2,y1=from.offsetTop+from.offsetHeight,x2=to.offsetLeft+to.offsetWidth/2,y2=to.offsetTop,mid=y1+(y2-y1)/2;const p=document.createElementNS("http://www.w3.org/2000/svg","path");p.setAttribute("d",`M${x1},${y1} V${mid} H${x2} V${y2}`);p.setAttribute("class",`wf-edge ${selectedTask().status==="running"&&i>4?"running":""}`);svg.append(p)})}
    function applyWorkflowTransform(){const stage=document.getElementById("workflowStage");if(stage)stage.style.transform=`translate(${appState.panX}px,${appState.panY}px) scale(${appState.zoom})`}
    function fitWorkflow(){const vp=document.getElementById("workflowViewport");if(!vp)return;appState.zoom=Math.min((vp.clientWidth-80)/1400,(vp.clientHeight-60)/900,.95);appState.panX=(vp.clientWidth-1400*appState.zoom)/2;appState.panY=Math.max(20,(vp.clientHeight-900*appState.zoom)/2);applyWorkflowTransform()}
    function initWorkflowPan(){const vp=document.getElementById("workflowViewport");if(!vp||vp.dataset.ready)return;vp.dataset.ready="1";let drag=false,sx=0,sy=0,px=0,py=0;vp.addEventListener("pointerdown",e=>{if(e.target.closest(".wf-node"))return;drag=true;sx=e.clientX;sy=e.clientY;px=appState.panX;py=appState.panY;vp.classList.add("dragging");vp.setPointerCapture(e.pointerId)});vp.addEventListener("pointermove",e=>{if(!drag)return;appState.panX=px+e.clientX-sx;appState.panY=py+e.clientY-sy;applyWorkflowTransform()});vp.addEventListener("pointerup",()=>{drag=false;vp.classList.remove("dragging")});vp.addEventListener("wheel",e=>{e.preventDefault();appState.zoom=Math.max(.35,Math.min(1.5,appState.zoom+(e.deltaY<0?.08:-.08)));applyWorkflowTransform()},{passive:false})}

    function renderAgents(){return `<section class="view"><div class="page-head"><div><h1 class="page-title">Agent 注册表</h1><div class="page-desc">角色能力、调用性能与运行健康度</div></div><button class="secondary-btn">导出指标</button></div><div class="table-wrap" style="border-top:1px solid var(--line);border-radius:8px"><table><thead><tr><th>Agent</th><th>角色</th><th>状态</th><th>能力说明</th><th>调用量</th><th>p95 延迟</th><th>错误率</th><th>Token</th><th>记忆写入</th></tr></thead><tbody>${agents.map(a=>`<tr data-agent-id="${a.id}"><td class="mono">${a.id}</td><td><strong>${a.role}</strong></td><td>${statusPill(a.status==="busy"?"running":"success")}</td><td>${a.description}</td><td>${a.calls}</td><td>${a.p95}s</td><td>${a.error}%</td><td>${fmtTokens(a.tokens)}</td><td>${a.memoryWrites}</td></tr>`).join("")}</tbody></table></div></section>`}

    function renderStates(){return `<section class="view"><div class="page-head"><div><h1 class="page-title">状态池</h1><div class="page-desc">非文本状态分层、访问策略与生命周期</div></div><div class="page-actions"><select class="filter-select" id="stateTier"><option value="all">全部层级</option><option>hot</option><option>warm</option><option>cold</option><option>tombstone</option></select><button class="secondary-btn">运行 GC 预检</button></div></div><div class="pool-summary">${poolTier("Hot",10,"42 MB","var(--red)")}${poolTier("Warm",12,"68 MB","var(--amber)")}${poolTier("Cold",28,"272 MB","var(--blue)")}${poolTier("Tombstone",4,"仅元数据","#8996a0")}</div><div class="table-wrap" style="border-top:1px solid var(--line);border-radius:8px"><table><thead><tr><th>State ID</th><th>类型</th><th>层级</th><th>生命周期</th><th>来源 Agent</th><th>任务</th><th>大小</th><th>访问策略</th><th>读租约</th><th>Lineage</th></tr></thead><tbody id="stateRows">${states.map(stateRow).join("")}</tbody></table></div></section>`}
    function poolTier(name,count,size,color){return `<div class="pool-tier"><div class="pool-tier-row"><span><i class="pool-dot" style="display:inline-block;background:${color};margin-right:7px"></i>${name}</span><strong>${count}</strong></div><div class="dense-sub" style="margin-top:4px">${size}</div></div>`}
    function stateRow(s){const tier=s.lifecycle==="deleted"||s.lifecycle==="tombstoned"?"tombstone":s.tier;return `<tr data-state-id="${s.id}" data-tier="${tier}"><td class="mono">${s.id}</td><td>${s.type}</td><td><span class="mode-tag">${tier}</span></td><td>${s.lifecycle}</td><td class="mono">${s.agent}</td><td class="mono">${s.task}</td><td>${s.size?`${(s.size/1024).toFixed(1)} KB`:"--"}</td><td>${s.policy}</td><td>${s.readers}</td><td>${s.protected?"已保护":"--"}</td></tr>`}

    function renderMemory(){return `<section class="view"><div class="page-head"><div><h1 class="page-title">记忆池</h1><div class="page-desc">声明、记忆视图与证据晋升关系</div></div><div class="page-actions"><select class="filter-select"><option>全部节点类型</option><option>MemoryView</option><option>ClaimCard</option><option>PromotionView</option></select><button class="secondary-btn" data-memory-fit>适配图谱</button></div></div><div class="memory-layout"><div class="panel memory-canvas" id="memoryCanvas"><div class="memory-stage" id="memoryStage"><svg class="memory-edge-layer" id="memoryEdges"></svg>${memoryNodes.map(n=>`<button class="memory-node ${n.type}" data-memory-id="${n.id}" style="left:${n.x}px;top:${n.y}px"><strong>${esc(n.label)}</strong><br><span class="dense-sub">${esc(n.summary)}</span></button>`).join("")}</div></div><aside class="memory-side"><div class="panel"><div class="panel-head"><span class="panel-title">节点类型</span><span class="panel-meta">${memoryNodes.length} nodes</span></div><div class="type-list">${[["MemoryView","view"],["ClaimCard","claim"],["PromotionView","promotion"],["MemoryObject","object"],["Candidate","candidate"],["StateObject","stateobj"]].map(([label,type])=>`<div class="type-item"><i class="legend-shape memory-node ${type}" style="position:static;width:10px;min-height:10px;padding:0"></i>${label}<strong>${memoryNodes.filter(n=>n.type===type).length}</strong></div>`).join("")}</div></div><div class="panel"><div class="panel-head"><span class="panel-title">记忆健康度</span></div><div class="panel-body"><div class="legend"><div class="legend-item">Active views<strong>7</strong></div><div class="legend-item">Active claims<strong>19</strong></div><div class="legend-item">Pending candidates<strong>1</strong></div><div class="legend-item">Admission rate<strong>98.3%</strong></div></div></div></div></aside></div></section>`}
    function drawMemoryEdges(){const svg=document.getElementById("memoryEdges");if(!svg)return;memoryEdges.forEach(([a,b])=>{const from=memoryNodes.find(n=>n.id===a),to=memoryNodes.find(n=>n.id===b);if(!from||!to)return;const x1=from.x+58,y1=from.y+48,x2=to.x+58,y2=to.y,mid=y1+(y2-y1)/2;const p=document.createElementNS("http://www.w3.org/2000/svg","path");p.setAttribute("d",`M${x1},${y1} V${mid} H${x2} V${y2}`);p.setAttribute("class","memory-edge");svg.append(p)})}
    function fitMemory(){const canvas=document.getElementById("memoryCanvas"),stage=document.getElementById("memoryStage");if(!canvas||!stage)return;const scale=Math.min(1,Math.max(.34,(canvas.clientWidth-24)/900));stage.style.transform=`translateX(-50%) scale(${scale})`;canvas.style.height=`${Math.max(360,680*scale+40)}px`}

    function renderAlerts(){return `<section class="view"><div class="page-head"><div><h1 class="page-title">告警中心</h1><div class="page-desc">运行异常、契约治理与资源生命周期事件</div></div><button class="secondary-btn">告警规则</button></div><div class="metrics-strip" style="grid-template-columns:repeat(4,minmax(0,1fr))">${metric("未处理",2,"需要关注","metric-down")}${metric("观察中",1,"自动恢复")}${metric("今日已关闭",8,"平均 14m","metric-up")}${metric("高优先级",1,"contract_guard","metric-down")}</div><div class="table-wrap" style="border-top:1px solid var(--line);border-radius:8px"><table><thead><tr><th>严重级别</th><th>告警</th><th>任务</th><th>来源</th><th>时间</th><th>状态</th></tr></thead><tbody>${alerts.map(a=>`<tr data-alert-id="${a.id}"><td><span class="status-pill ${a.severity==='error'?'status-failed':a.severity==='warn'?'status-running':'status-waiting'}"><span class="status-dot"></span>${a.severity.toUpperCase()}</span></td><td><strong>${a.title}</strong><div class="dense-sub mono">${a.id}</div></td><td class="mono">${a.task}</td><td>${a.source}</td><td>${a.time}</td><td>${a.status}</td></tr>`).join("")}</tbody></table></div></section>`}

    function objectTabs(obj){if(obj.kind==="agent")return ["overview","input","output","contract","logs"];if(obj.kind==="payload")return ["overview","payload","refs","cost"];return ["overview","raw"]}
    const tabLabels={overview:"概览",input:"接收内容",output:"输出内容",contract:"契约与重试",logs:"日志",payload:"Payload",refs:"Refs",cost:"成本",raw:"原始数据"};
    function openDrawer(kind,obj,title,sub){appState.drawer={kind,obj,title,sub};appState.drawerTab="overview";renderDrawer();document.getElementById("drawerBackdrop").classList.add("open");document.getElementById("drawer").classList.add("open");document.getElementById("drawer").setAttribute("aria-hidden","false")}
    function closeDrawer(){document.getElementById("drawerBackdrop").classList.remove("open");document.getElementById("drawer").classList.remove("open");document.getElementById("drawer").setAttribute("aria-hidden","true")}
    function renderDrawer(){const d=appState.drawer;if(!d)return;document.getElementById("drawerTitle").textContent=d.title;document.getElementById("drawerSub").textContent=d.sub||"";document.getElementById("drawerTabs").innerHTML=objectTabs(d).map(t=>`<button class="drawer-tab ${appState.drawerTab===t?'active':''}" data-drawer-tab="${t}">${tabLabels[t]}</button>`).join("");document.getElementById("drawerBody").innerHTML=drawerContent(d)}
    function drawerContent(d){const o=d.obj,tab=appState.drawerTab;if(tab==="overview")return detailGrid(o);if(tab==="input")return `<pre class="code-block">${esc(o.input||"无输入记录")}</pre>`;if(tab==="output")return `<pre class="code-block">${esc(o.output||"无输出记录")}</pre>`;if(tab==="contract")return detailGrid({contract_status:o.contract||"not_checked",schema_valid:o.contract==="schema_valid",retry_count:o.contract==="schema_valid"?0:1,fallback:false});if(tab==="logs")return (o.logs||[]).map(l=>`<div class="log-line"><span>${l.time}</span><span class="log-level ${l.level.toLowerCase()}">${l.level}</span><span>${esc(l.text)}</span></div>`).join("");if(tab==="payload")return `<pre class="code-block">${esc(JSON.stringify(o.payload||o,null,2))}</pre>`;if(tab==="refs")return detailGrid({state_refs:(o.refs||[]).filter(x=>x.startsWith("state_")).join("\n")||"--",memory_refs:(o.refs||[]).filter(x=>x.startsWith("mem_")).join("\n")||"--"});if(tab==="cost")return detailGrid(o.cost||{});return `<pre class="code-block">${esc(JSON.stringify(o,null,2))}</pre>`}
    function detailGrid(obj){return `<div class="detail-grid">${Object.entries(obj).filter(([k])=>!['logs','input','output','payload','cost'].includes(k)).map(([k,v])=>`<div class="detail-key">${esc(k)}</div><div class="detail-value ${typeof v==='string'&&v.length>40?'mono':''}">${esc(typeof v==='object'?JSON.stringify(v,null,2):v)}</div>`).join("")}</div>`}

    function showToast(text){const el=document.getElementById("toast");el.textContent=text;el.classList.add("show");clearTimeout(showToast.timer);showToast.timer=setTimeout(()=>el.classList.remove("show"),2200)}
    function openModal(){document.getElementById("experimentModal").classList.add("open");document.getElementById("newQuestion").focus()}
    function closeModal(){document.getElementById("experimentModal").classList.remove("open")}

    document.addEventListener("click",e=>{
      const nav=e.target.closest("[data-nav]");if(nav){setView(nav.dataset.nav);return}
      const action=e.target.closest("[data-action]")?.dataset.action;
      if(action==="new-experiment")openModal();if(action==="close-modal")closeModal();if(action==="close-drawer")closeDrawer();
      const task=e.target.closest("[data-task-id]");if(task){appState.selectedTask=task.dataset.taskId;appState.workflowMode=tasks.find(t=>t.id===appState.selectedTask)?.mode||"runtime_lite";setView("workflow");return}
      const mode=e.target.closest("[data-mode]");if(mode){appState.workflowMode=mode.dataset.mode;render();requestAnimationFrame(fitWorkflow);return}
      const node=e.target.closest("[data-node-id]");if(node){const n=workflowSet().nodes.find(x=>x.id===node.dataset.nodeId);if(n)openDrawer(n.type==="agent"?"agent":n.type==="payload"?"payload":"object",n.detail,n.label,`${n.type} · ${n.id}`);return}
      const stateEl=e.target.closest("[data-state-id]");if(stateEl){const s=states.find(x=>x.id===stateEl.dataset.stateId);openDrawer("object",s,"状态对象",s.id);return}
      const mem=e.target.closest("[data-memory-id]");if(mem){const m=memoryNodes.find(x=>x.id===mem.dataset.memoryId);openDrawer("object",m,"记忆对象",m.id);return}
      if(e.target.closest("[data-memory-fit]")){fitMemory();showToast("图谱已适配当前视图");return}
      const alert=e.target.closest("[data-alert-id]");if(alert){const a=alerts.find(x=>x.id===alert.dataset.alertId);openDrawer("object",a,"告警详情",a.id);return}
      const agent=e.target.closest("[data-agent-id]");if(agent){const a=agents.find(x=>x.id===agent.dataset.agentId);openDrawer("object",a,"Agent 详情",a.id);return}
      const tab=e.target.closest("[data-drawer-tab]");if(tab){appState.drawerTab=tab.dataset.drawerTab;renderDrawer();return}
      const sort=e.target.closest("[data-sort]");if(sort){if(appState.sortKey===sort.dataset.sort)appState.sortDir=appState.sortDir==="asc"?"desc":"asc";else{appState.sortKey=sort.dataset.sort;appState.sortDir="asc"}render();return}
      const canvas=e.target.closest("[data-canvas]")?.dataset.canvas;if(canvas){if(canvas==="zoom-in")appState.zoom=Math.min(1.5,appState.zoom+.1);if(canvas==="zoom-out")appState.zoom=Math.max(.35,appState.zoom-.1);if(canvas==="reset"){appState.zoom=.82;appState.panX=80;appState.panY=10}if(canvas==="fit")fitWorkflow();else applyWorkflowTransform()}
    });
    document.getElementById("drawerBackdrop").addEventListener("click",closeDrawer);
    document.getElementById("mobileMenu").addEventListener("click",()=>document.getElementById("sidebar").classList.toggle("mobile-open"));
    document.getElementById("globalSearch").addEventListener("keydown",e=>{if(e.key==="Enter"){appState.taskQuery=e.target.value;setView("tasks")}});
    document.addEventListener("input",e=>{if(e.target.id==="taskSearch"){appState.taskQuery=e.target.value;updateTaskTable()}});
    document.addEventListener("change",e=>{if(e.target.id==="taskStatus"){appState.taskStatus=e.target.value;updateTaskTable()}if(e.target.id==="taskMode"){appState.taskMode=e.target.value;updateTaskTable()}if(e.target.id==="stateTier"){document.querySelectorAll("#stateRows tr").forEach(r=>r.style.display=e.target.value==="all"||r.dataset.tier===e.target.value?"":"none")}});
    document.getElementById("experimentForm").addEventListener("submit",e=>{e.preventDefault();const id=`RUN-DEMO-${String(tasks.length+1).padStart(2,"0")}`;tasks.unshift({id,question:document.getElementById("newQuestion").value,group:document.getElementById("newGroup").value,mode:document.getElementById("newMode").value,status:"running",progress:12,agents:5,duration:3.4,tokens:640,memoryHits:0,startedAt:"刚刚",alerts:0});document.getElementById("taskBadge").textContent=tasks.length;closeModal();appState.selectedTask=id;showToast(`实验 ${id} 已创建并开始模拟运行`);setView("tasks")});
    document.addEventListener("keydown",e=>{if(e.key==="Escape"){closeDrawer();closeModal()}});
    window.addEventListener("resize",()=>{if(appState.view==="workflow")fitWorkflow()});

    render();
  </script>
</body>
</html>
