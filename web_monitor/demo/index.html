<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Agent Runtime Console - 多智能体运行观测平台</title>
  <style>
    :root {
      color-scheme: light;
      --sidebar: #151c24;
      --sidebar-2: #1d2731;
      --canvas: #eef2f5;
      --surface: #ffffff;
      --surface-2: #f7f9fa;
      --line: #dce3e8;
      --line-strong: #c8d2d9;
      --text: #18232c;
      --muted: #667580;
      --faint: #94a1aa;
      --teal: #14858b;
      --teal-soft: #e1f3f3;
      --green: #2f8a4b;
      --green-soft: #e7f4eb;
      --amber: #b97808;
      --amber-soft: #fff2d8;
      --red: #c4473d;
      --red-soft: #fde9e7;
      --blue: #3478c8;
      --blue-soft: #e8f1fb;
      --purple: #7552b8;
      --purple-soft: #eee8f8;
      --shadow: 0 8px 24px rgba(21, 36, 48, .12);
      --mono: "Cascadia Mono", "SFMono-Regular", Consolas, monospace;
    }

    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; }
    body {
      background: var(--canvas);
      color: var(--text);
      font: 14px/1.5 "Segoe UI", "Microsoft YaHei", Arial, sans-serif;
      letter-spacing: 0;
      overflow: hidden;
    }
    button, input, select, textarea { font: inherit; letter-spacing: 0; }
    button { cursor: pointer; }
    .mono { font-family: var(--mono); }
    .muted { color: var(--muted); }
    .faint { color: var(--faint); }
    .truncate { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

    .app { min-height: 100vh; }
    .sidebar {
      position: fixed; inset: 0 auto 0 0; z-index: 30;
      width: 232px; background: var(--sidebar); color: #dfe7ed;
      display: flex; flex-direction: column; border-right: 1px solid #26313c;
    }
    .brand {
      height: 64px; display: flex; align-items: center; gap: 11px;
      padding: 0 18px; border-bottom: 1px solid #2a3540;
    }
    .brand-mark {
      width: 32px; height: 32px; border: 1px solid #3bb0b4; color: #55c3c6;
      display: grid; place-items: center; border-radius: 7px; font-weight: 800;
    }
    .brand-title { font-weight: 700; font-size: 15px; color: #fff; }
    .brand-sub { font-size: 11px; color: #83929e; }
    .nav-section { padding: 16px 10px 8px; }
    .nav-caption { padding: 0 10px 8px; color: #71808d; font-size: 11px; text-transform: uppercase; }
    .nav-button {
      width: 100%; min-height: 40px; border: 0; border-radius: 6px;
      color: #aebbc5; background: transparent; display: flex; align-items: center;
      gap: 11px; padding: 0 11px; text-align: left; margin-bottom: 3px;
    }
    .nav-button:hover { color: #fff; background: #222e39; }
    .nav-button.active { color: #fff; background: #263640; box-shadow: inset 3px 0 var(--teal); }
    .nav-icon { width: 22px; text-align: center; color: #72bfc2; font: 16px var(--mono); }
    .nav-badge { margin-left: auto; min-width: 20px; padding: 1px 6px; border-radius: 9px; background: #33414d; font-size: 11px; text-align: center; }
    .sidebar-footer { margin-top: auto; padding: 14px; border-top: 1px solid #2a3540; }
    .system-health { display: flex; gap: 9px; align-items: center; color: #9eabb5; font-size: 12px; }
    .health-dot { width: 8px; height: 8px; border-radius: 50%; background: #4eae69; box-shadow: 0 0 0 3px rgba(78,174,105,.12); }

    .topbar {
      position: fixed; left: 232px; right: 0; top: 0; z-index: 25; height: 56px;
      background: rgba(255,255,255,.97); border-bottom: 1px solid var(--line);
      display: flex; align-items: center; justify-content: space-between; padding: 0 18px;
    }
    .top-left, .top-right { display: flex; align-items: center; gap: 10px; min-width: 0; }
    .mobile-menu { display: none; }
    .env-select, .range-select, .filter-select, .field {
      height: 34px; border: 1px solid var(--line-strong); border-radius: 6px;
      background: #fff; color: var(--text); padding: 0 10px; outline: none;
    }
    .env-select { font-family: var(--mono); }
    .env-badge {
      min-height: 34px; display: inline-flex; align-items: center; gap: 7px;
      border: 1px solid var(--line-strong); border-radius: 6px;
      background: #fff; color: var(--text); padding: 0 11px; font-family: var(--mono);
      white-space: nowrap;
    }
    .global-search {
      width: 300px; height: 34px; border: 1px solid var(--line); border-radius: 6px;
      background: var(--surface-2); padding: 0 11px; outline: none;
    }
    .global-search:focus, .field:focus, .filter-select:focus { border-color: var(--teal); box-shadow: 0 0 0 2px rgba(20,133,139,.1); }
    .health-chip { height: 30px; display: inline-flex; align-items: center; gap: 7px; padding: 0 10px; border: 1px solid #badac4; color: var(--green); background: var(--green-soft); border-radius: 15px; font-size: 12px; }
    .primary-btn, .secondary-btn, .icon-btn, .ghost-btn, .danger-btn {
      min-height: 34px; border-radius: 6px; border: 1px solid transparent; padding: 0 12px; display: inline-flex; align-items: center; justify-content: center; gap: 7px;
    }
    .primary-btn { color: #fff; background: var(--teal); border-color: var(--teal); }
    .primary-btn:hover { background: #0e7479; }
    .secondary-btn, .icon-btn { color: var(--text); background: #fff; border-color: var(--line-strong); }
    .secondary-btn:hover, .icon-btn:hover { background: var(--surface-2); }
    .ghost-btn { color: var(--muted); background: transparent; }
    .danger-btn { color: var(--red); background: var(--red-soft); border-color: #efc1bd; }
    .icon-btn { width: 34px; padding: 0; font: 17px var(--mono); }

    .main { position: fixed; left: 232px; top: 56px; right: 0; bottom: 0; overflow: auto; }
    .view { min-height: 100%; padding: 18px; }
    .page-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 16px; margin-bottom: 16px; }
    .page-title { margin: 0; font-size: 21px; line-height: 1.3; }
    .page-desc { margin-top: 4px; color: var(--muted); font-size: 13px; }
    .page-actions { display: flex; gap: 8px; flex-wrap: wrap; }

    .metrics-strip { display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); background: var(--surface); border: 1px solid var(--line); border-radius: 8px; margin-bottom: 14px; }
    .metric { padding: 14px 16px; min-width: 0; border-right: 1px solid var(--line); }
    .metric:last-child { border-right: 0; }
    .metric-label { color: var(--muted); font-size: 12px; margin-bottom: 6px; }
    .metric-value { font-size: 25px; line-height: 1.2; font-weight: 700; }
    .metric-foot { margin-top: 5px; font-size: 11px; color: var(--faint); }
    .metric-up { color: var(--green); }
    .metric-down { color: var(--red); }

    .dashboard-grid { display: grid; grid-template-columns: minmax(0, 1.5fr) minmax(280px, .72fr) minmax(300px, .85fr); gap: 14px; }
    .panel { background: var(--surface); border: 1px solid var(--line); border-radius: 8px; min-width: 0; }
    .panel.span-2 { grid-column: span 2; }
    .panel-head { min-height: 45px; padding: 0 14px; display: flex; align-items: center; justify-content: space-between; gap: 12px; border-bottom: 1px solid var(--line); }
    .panel-title { font-size: 14px; font-weight: 700; }
    .panel-meta { color: var(--faint); font-size: 11px; }
    .panel-body { padding: 14px; }
    .trend-svg { width: 100%; height: 230px; display: block; }
    .grid-line { stroke: #e7ecef; stroke-width: 1; }
    .trend-line { fill: none; stroke: var(--teal); stroke-width: 2.5; }
    .trend-area { fill: rgba(20,133,139,.09); }
    .trend-point { fill: #fff; stroke: var(--teal); stroke-width: 2; }
    .axis-label { fill: #84919b; font-size: 11px; }
    .donut-row { display: flex; align-items: center; gap: 22px; padding: 8px 4px; }
    .donut { width: 132px; height: 132px; border-radius: 50%; background: conic-gradient(var(--green) 0 62%, var(--amber) 62% 76%, var(--red) 76% 86%, #9aa7b0 86% 100%); position: relative; flex: 0 0 auto; }
    .donut::after { content: ""; position: absolute; inset: 25px; background: #fff; border-radius: 50%; }
    .donut-center { position: absolute; inset: 0; z-index: 1; display: grid; place-content: center; text-align: center; font-weight: 700; }
    .legend { display: grid; gap: 8px; width: 100%; }
    .legend-item { display: flex; align-items: center; gap: 8px; color: var(--muted); }
    .legend-item strong { margin-left: auto; color: var(--text); }
    .legend-dot { width: 8px; height: 8px; border-radius: 50%; }
    .bar-list { display: grid; gap: 12px; }
    .bar-row { display: grid; grid-template-columns: 112px 1fr 48px; gap: 10px; align-items: center; font-size: 12px; }
    .bar-track { height: 7px; border-radius: 4px; background: #e8edf0; overflow: hidden; }
    .bar-fill { height: 100%; background: var(--teal); border-radius: 4px; }
    .tier-track { display: flex; height: 14px; overflow: hidden; border-radius: 4px; background: #e9eef1; margin: 12px 0 14px; }
    .tier-hot { background: var(--red); } .tier-warm { background: var(--amber); } .tier-cold { background: var(--blue); } .tier-tomb { background: #8996a0; }

    .dense-list { display: grid; }
    .dense-item { min-height: 50px; padding: 9px 14px; display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 10px; align-items: center; border-bottom: 1px solid var(--line); cursor: pointer; }
    .dense-item:last-child { border-bottom: 0; }
    .dense-item:hover { background: var(--surface-2); }
    .severity { width: 4px; height: 30px; border-radius: 2px; background: var(--amber); }
    .severity.error { background: var(--red); }
    .severity.info { background: var(--blue); }
    .dense-title { font-weight: 600; font-size: 13px; }
    .dense-sub { color: var(--muted); font-size: 11px; }

    .toolbar { min-height: 52px; background: var(--surface); border: 1px solid var(--line); border-radius: 8px 8px 0 0; display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 8px 10px; }
    .toolbar-group { display: flex; align-items: center; gap: 8px; min-width: 0; flex-wrap: wrap; }
    .table-wrap { background: var(--surface); border: 1px solid var(--line); border-top: 0; border-radius: 0 0 8px 8px; overflow: auto; }
    table { width: 100%; border-collapse: collapse; min-width: 1000px; }
    th { position: sticky; top: 0; z-index: 2; height: 40px; padding: 0 11px; background: #f5f7f8; color: #53626d; font-size: 11px; text-align: left; white-space: nowrap; border-bottom: 1px solid var(--line-strong); }
    th.sortable { cursor: pointer; }
    th.sortable:hover { color: var(--teal); }
    td { height: 48px; padding: 7px 11px; border-bottom: 1px solid var(--line); vertical-align: middle; }
    tbody tr { cursor: pointer; }
    tbody tr:hover { background: #f4f9f9; }
    .question-cell { max-width: 410px; font-weight: 600; }
    .status-pill { display: inline-flex; align-items: center; gap: 6px; height: 23px; padding: 0 8px; border-radius: 12px; font-size: 11px; white-space: nowrap; }
    .status-success { color: var(--green); background: var(--green-soft); }
    .status-running { color: var(--amber); background: var(--amber-soft); }
    .status-failed { color: var(--red); background: var(--red-soft); }
    .status-waiting, .status-stopped { color: #63717b; background: #edf1f3; }
    .status-dot { width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
    .progress { width: 90px; height: 5px; background: #e7ecef; border-radius: 3px; overflow: hidden; }
    .progress > span { display: block; height: 100%; background: var(--teal); }
    .mode-tag { font: 11px var(--mono); color: var(--purple); background: var(--purple-soft); border-radius: 4px; padding: 3px 6px; }
    .mode-tag.baseline { color: var(--blue); background: var(--blue-soft); }

    .workflow-view { padding: 0; overflow: hidden; height: 100%; user-select: none; }
    .workflow-header { background: var(--surface); border-bottom: 1px solid var(--line); padding: 13px 16px 11px; }
    .breadcrumb { color: var(--muted); font-size: 12px; margin-bottom: 8px; }
    .breadcrumb button { border: 0; background: none; color: var(--teal); padding: 0; }
    .workflow-title-row { display: flex; justify-content: space-between; gap: 18px; align-items: flex-start; }
    .workflow-question { font-size: 16px; font-weight: 700; max-width: 850px; }
    .workflow-meta { display: flex; gap: 20px; margin-top: 10px; color: var(--muted); font-size: 12px; flex-wrap: wrap; }
    .workflow-meta strong { color: var(--text); margin-left: 4px; }
    .workflow-token-strip { display: grid; grid-template-columns: repeat(4, minmax(130px, 1fr)); gap: 8px; margin-top: 12px; max-width: 820px; }
    .cost-chip { min-height: 54px; border: 1px solid var(--line); border-radius: 7px; background: #f8fafb; padding: 8px 10px; }
    .cost-chip span { display: block; color: var(--muted); font-size: 11px; }
    .cost-chip strong { display: block; margin-top: 3px; font-size: 16px; }
    .segment { display: inline-flex; border: 1px solid var(--line-strong); border-radius: 6px; padding: 2px; background: var(--surface-2); }
    .segment button { min-height: 29px; padding: 0 11px; border: 0; border-radius: 4px; background: transparent; color: var(--muted); }
    .segment button.active { color: #fff; background: var(--teal); }
    .workflow-shell { height: calc(100vh - 183px); display: grid; grid-template-columns: 210px minmax(0, 1fr); }
    .workflow-aside { background: #f8fafb; border-right: 1px solid var(--line); overflow: auto; padding: 12px 10px; user-select: none; }
    .aside-title { font-size: 11px; color: var(--muted); text-transform: uppercase; padding: 5px 7px 8px; }
    .aside-agent { border: 0; width: 100%; min-height: 39px; border-radius: 5px; background: transparent; text-align: left; display: flex; align-items: center; gap: 8px; padding: 6px 7px; color: var(--text); }
    .aside-agent:hover { background: #edf3f5; }
    .aside-agent .mini-status { width: 7px; height: 7px; border-radius: 50%; background: var(--green); }
    .aside-stat { display: flex; justify-content: space-between; padding: 6px 7px; color: var(--muted); font-size: 12px; }
    .aside-stat strong { color: var(--text); }
    .canvas-wrap { position: relative; min-width: 0; background: #eaf0f3; overflow: hidden; user-select: none; }
    .workflow-viewport { position: absolute; inset: 0; cursor: grab; overflow: hidden; background-image: radial-gradient(#cbd5dc 1px, transparent 1px); background-size: 20px 20px; user-select: none; touch-action: none; }
    .workflow-viewport.dragging { cursor: grabbing; }
    .workflow-stage { position: absolute; width: 1400px; height: 900px; transform-origin: 0 0; }
    .edge-layer { position: absolute; inset: 0; width: 1400px; height: 900px; overflow: visible; pointer-events: none; }
    .wf-edge { fill: none; stroke: #6c98ab; stroke-width: 1.6; marker-end: url(#arrow); }
    .wf-edge.running { stroke: var(--amber); stroke-dasharray: 7 5; animation: dash 1.6s linear infinite; }
    @keyframes dash { to { stroke-dashoffset: -24; } }
    .wf-node { position: absolute; z-index: 2; border: 1px solid; border-radius: 7px; background: #fff; box-shadow: 0 3px 8px rgba(43,64,77,.1); cursor: grab; overflow: hidden; text-align: left; touch-action: none; user-select: none; }
    .wf-node.dragging { cursor: grabbing; z-index: 5; }
    .wf-node:hover, .wf-node.selected { box-shadow: 0 0 0 2px rgba(20,133,139,.2), 0 6px 16px rgba(43,64,77,.16); }
    .wf-node.agent { width: 220px; min-height: 88px; border-color: #5eaeb2; }
    .wf-node.agent .node-head { background: var(--teal); color: #fff; }
    .wf-node.start, .wf-node.final { width: 290px; min-height: 62px; border-color: #63a978; }
    .wf-node.start .node-head, .wf-node.final .node-head { background: var(--green); color: #fff; }
    .wf-node.payload { width: 150px; min-height: 55px; border-color: #7eabd7; clip-path: polygon(8px 0, 100% 0, 100% calc(100% - 8px), calc(100% - 8px) 100%, 0 100%, 0 8px); }
    .wf-node.payload .node-head { color: var(--blue); background: var(--blue-soft); }
    .wf-node.state { width: 150px; min-height: 55px; border-color: #e2ad52; }
    .wf-node.state .node-head { color: var(--amber); background: var(--amber-soft); }
    .wf-node.memory { width: 150px; min-height: 55px; border-color: #a68bd1; }
    .wf-node.memory .node-head { color: var(--purple); background: var(--purple-soft); }
    .wf-node.failed { border-color: var(--red); }
    .wf-node.failed .node-head { background: var(--red); color: #fff; }
    .node-head { min-height: 28px; padding: 5px 9px; display: flex; align-items: center; justify-content: space-between; gap: 8px; font-size: 11px; font-weight: 700; }
    .node-body { padding: 7px 9px; }
    .node-title { font-weight: 700; font-size: 13px; }
    .node-summary { color: var(--muted); font-size: 11px; margin-top: 2px; line-height: 1.35; }
    .node-foot { display: flex; gap: 8px; margin-top: 5px; color: var(--faint); font-size: 10px; }
    .canvas-controls { position: absolute; right: 14px; top: 14px; z-index: 6; display: flex; gap: 4px; padding: 4px; border: 1px solid var(--line); border-radius: 7px; background: rgba(255,255,255,.95); box-shadow: var(--shadow); }
    .canvas-controls button { width: 31px; height: 31px; border: 0; background: transparent; color: var(--text); border-radius: 4px; font: 16px var(--mono); }
    .canvas-controls button:hover { background: var(--surface-2); }
    .canvas-legend { position: absolute; left: 14px; bottom: 14px; z-index: 6; display: flex; gap: 12px; padding: 7px 10px; border: 1px solid var(--line); border-radius: 6px; background: rgba(255,255,255,.94); color: var(--muted); font-size: 10px; }
    .legend-shape { width: 10px; height: 10px; border: 1px solid; display: inline-block; margin-right: 4px; vertical-align: -1px; }
    .minimap { position: absolute; right: 14px; bottom: 14px; z-index: 6; width: 168px; height: 108px; border: 1px solid var(--line-strong); background: rgba(255,255,255,.94); border-radius: 6px; overflow: hidden; }
    .minimap-node { position: absolute; border-radius: 2px; background: #76aeb1; min-width: 8px; min-height: 5px; }
    .minimap-node.payload { background: #82a9d2; } .minimap-node.state { background: #d9a84f; } .minimap-node.memory { background: #9e86c7; }

    .pool-summary { display: grid; grid-template-columns: repeat(4, minmax(0,1fr)); border: 1px solid var(--line); border-radius: 8px; background: var(--surface); margin-bottom: 14px; }
    .pool-tier { padding: 14px 16px; border-right: 1px solid var(--line); }
    .pool-tier:last-child { border-right: 0; }
    .pool-tier-row { display: flex; align-items: center; justify-content: space-between; }
    .pool-tier strong { font-size: 23px; }
    .pool-dot { width: 9px; height: 9px; border-radius: 2px; }
    .memory-layout { display: grid; grid-template-columns: minmax(0,1fr) 260px; gap: 14px; }
    .memory-canvas { height: calc(100vh - 190px); min-height: 570px; position: relative; overflow: auto; background-color: #f7f9fa; background-image: radial-gradient(#d8e0e5 1px, transparent 1px); background-size: 20px 20px; }
    .memory-stage { position: relative; width: 1120px; min-height: 760px; margin: 18px; transform-origin: top left; }
    .memory-edge-layer { position: absolute; inset: 0; width: 1120px; height: 760px; pointer-events: none; }
    .memory-edge { stroke: #abb7c0; stroke-width: 1.3; fill: none; }
    .memory-node { position: absolute; width: 172px; min-height: 66px; padding: 8px; border: 1px solid; border-radius: 7px; background: #fff; text-align: left; cursor: pointer; box-shadow: 0 2px 7px rgba(40,58,70,.1); font-size: 11px; overflow: hidden; }
    .memory-node strong { display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .memory-node:hover { box-shadow: 0 0 0 2px rgba(117,82,184,.18); }
    .memory-node.view { border-color: var(--teal); background: var(--teal-soft); }
    .memory-node.claim { border-color: var(--amber); background: var(--amber-soft); }
    .memory-node.promotion { border-color: var(--purple); background: var(--purple-soft); }
    .memory-node.object { border-color: var(--blue); background: var(--blue-soft); }
    .memory-node.candidate { border-style: dashed; border-color: #8996a0; }
    .memory-node.stateobj { border-color: var(--red); background: var(--red-soft); }
    .memory-side { display: grid; gap: 14px; align-content: start; }
    .type-list { padding: 7px 0; }
    .type-item { display: flex; align-items: center; gap: 8px; padding: 7px 12px; color: var(--muted); font-size: 12px; }
    .type-item strong { margin-left: auto; color: var(--text); }

    .drawer-backdrop { position: fixed; inset: 0; z-index: 80; background: rgba(16,24,31,.44); opacity: 0; pointer-events: none; transition: opacity .18s; }
    .drawer-backdrop.open { opacity: 1; pointer-events: auto; }
    .drawer { position: fixed; z-index: 90; right: 0; top: 0; bottom: 0; width: 520px; max-width: 100%; background: var(--surface); box-shadow: -12px 0 30px rgba(20,31,39,.16); transform: translateX(100%); transition: transform .2s; display: flex; flex-direction: column; }
    .drawer.open { transform: translateX(0); }
    .drawer-head { min-height: 60px; padding: 10px 15px; border-bottom: 1px solid var(--line); display: flex; align-items: center; justify-content: space-between; gap: 12px; }
    .drawer-title { font-weight: 700; }
    .drawer-sub { color: var(--muted); font-size: 11px; }
    .drawer-tabs { display: flex; gap: 2px; padding: 0 12px; border-bottom: 1px solid var(--line); overflow-x: auto; }
    .drawer-tab { min-height: 39px; padding: 0 10px; white-space: nowrap; border: 0; border-bottom: 2px solid transparent; background: none; color: var(--muted); }
    .drawer-tab.active { color: var(--teal); border-bottom-color: var(--teal); }
    .drawer-body { flex: 1; overflow: auto; padding: 14px; }
    .detail-grid { display: grid; grid-template-columns: 130px minmax(0,1fr); border: 1px solid var(--line); border-bottom: 0; }
    .detail-key, .detail-value { padding: 8px 10px; border-bottom: 1px solid var(--line); }
    .detail-key { background: #f6f8f9; color: var(--muted); }
    .detail-value { overflow-wrap: anywhere; }
    .code-block { margin: 0; padding: 12px; border: 1px solid var(--line); border-radius: 6px; background: #f5f7f8; color: #26343d; white-space: pre-wrap; overflow-wrap: anywhere; font: 12px/1.55 var(--mono); max-height: 62vh; overflow: auto; }
    .log-line { display: grid; grid-template-columns: 76px 52px 1fr; gap: 8px; padding: 5px 0; border-bottom: 1px solid #edf1f3; font: 11px/1.45 var(--mono); }
    .log-level.warn { color: var(--amber); } .log-level.error { color: var(--red); } .log-level.info { color: var(--blue); }

    .modal-backdrop { position: fixed; inset: 0; z-index: 100; display: none; place-items: center; padding: 18px; background: rgba(16,24,31,.48); }
    .modal-backdrop.open { display: grid; }
    .modal { width: 620px; max-width: 100%; background: #fff; border-radius: 8px; box-shadow: var(--shadow); }
    .modal-head, .modal-foot { min-height: 54px; padding: 0 16px; display: flex; align-items: center; justify-content: space-between; gap: 10px; border-bottom: 1px solid var(--line); }
    .modal-foot { border: 0; border-top: 1px solid var(--line); justify-content: flex-end; }
    .modal-body { padding: 16px; display: grid; gap: 13px; }
    .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    .form-label { display: grid; gap: 5px; font-size: 12px; color: var(--muted); }
    .form-label textarea { min-height: 100px; resize: vertical; padding: 9px; }
    .form-label .field { width: 100%; }
    .toast { position: fixed; z-index: 130; right: 20px; bottom: 20px; max-width: 360px; padding: 10px 13px; border-radius: 6px; color: #fff; background: #25343e; box-shadow: var(--shadow); opacity: 0; transform: translateY(12px); pointer-events: none; transition: .18s; }
    .toast.show { opacity: 1; transform: translateY(0); }

    @media (max-width: 1280px) {
      .metrics-strip { grid-template-columns: repeat(3, minmax(0, 1fr)); }
      .metric:nth-child(3) { border-right: 0; }
      .metric:nth-child(-n+3) { border-bottom: 1px solid var(--line); }
      .dashboard-grid { grid-template-columns: minmax(0,1.4fr) minmax(280px,.8fr); }
      .dashboard-grid .panel:nth-child(3) { grid-column: span 2; }
    }
    @media (max-width: 900px) {
      .sidebar { width: 72px; }
      .brand { padding: 0 20px; }
      .brand-copy, .nav-label, .nav-caption, .nav-badge, .sidebar-footer { display: none; }
      .nav-button { justify-content: center; padding: 0; }
      .topbar, .main { left: 72px; }
      .global-search { width: 190px; }
      .workflow-shell { grid-template-columns: 1fr; }
      .workflow-aside { display: none; }
      .memory-layout { grid-template-columns: 1fr; }
      .memory-side { grid-template-columns: 1fr 1fr; }
    }
    @media (max-width: 680px) {
      body { overflow: auto; }
      .sidebar { transform: translateX(-100%); width: 232px; transition: transform .2s; }
      .sidebar.mobile-open { transform: translateX(0); }
      .brand-copy, .nav-label, .nav-caption, .nav-badge, .sidebar-footer { display: initial; }
      .nav-button { justify-content: flex-start; padding: 0 11px; }
      .topbar { left: 0; padding: 0 10px; }
      .main { position: absolute; left: 0; top: 56px; min-height: calc(100vh - 56px); overflow: visible; }
      .mobile-menu { display: inline-flex; }
      .global-search, .health-chip, .range-select { display: none; }
      .view { padding: 12px; }
      .page-head { align-items: stretch; flex-direction: column; }
      .metrics-strip { grid-template-columns: repeat(2, minmax(0,1fr)); }
      .metric, .metric:nth-child(3) { border-right: 1px solid var(--line); border-bottom: 1px solid var(--line); }
      .metric:nth-child(even) { border-right: 0; }
      .metric:nth-last-child(-n+2) { border-bottom: 0; }
      .dashboard-grid { grid-template-columns: 1fr; }
      .dashboard-grid .panel, .dashboard-grid .panel:nth-child(3) { grid-column: auto; }
      .pool-summary { grid-template-columns: 1fr 1fr; }
      .pool-tier:nth-child(2) { border-right: 0; }
      .pool-tier:nth-child(-n+2) { border-bottom: 1px solid var(--line); }
      .workflow-title-row { flex-direction: column; }
      .workflow-shell { height: calc(100vh - 250px); min-height: 560px; }
      .minimap { display: none; }
      .canvas-legend { max-width: calc(100% - 28px); overflow-x: auto; }
      .memory-side { grid-template-columns: 1fr; }
      .form-row { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <div class="app">
    <aside class="sidebar" id="sidebar">
      <div class="brand">
        <div class="brand-mark">AR</div>
        <div class="brand-copy"><div class="brand-title">Agent Runtime</div><div class="brand-sub">Observability Console</div></div>
      </div>
      <nav class="nav-section" id="mainNav">
        <div class="nav-caption">运行观测</div>
        <button class="nav-button active" data-nav="dashboard"><span class="nav-icon">⌂</span><span class="nav-label">驾驶舱</span></button>
        <button class="nav-button" data-nav="tasks"><span class="nav-icon">≡</span><span class="nav-label">任务实例</span><span class="nav-badge" id="taskBadge">0</span></button>
        <button class="nav-button" data-nav="workflowList"><span class="nav-icon">⌁</span><span class="nav-label">工作流观测</span></button>
        <button class="nav-button" data-nav="agents"><span class="nav-icon">A</span><span class="nav-label">Agent 注册表</span><span class="nav-badge">0</span></button>
        <div class="nav-caption" style="margin-top:12px">资源与治理</div>
        <button class="nav-button" data-nav="states"><span class="nav-icon">S</span><span class="nav-label">状态池</span><span class="nav-badge">0</span></button>
        <button class="nav-button" data-nav="memory"><span class="nav-icon">M</span><span class="nav-label">记忆池</span><span class="nav-badge">0</span></button>
        <button class="nav-button" data-nav="alerts"><span class="nav-icon">!</span><span class="nav-label">告警中心</span><span class="nav-badge">0</span></button>
      </nav>
      <div class="sidebar-footer"><div class="system-health"><span class="health-dot"></span><div><strong>Runtime Healthy</strong><br><span>v5.9 · 5 agents online</span></div></div></div>
    </aside>

    <header class="topbar">
      <div class="top-left">
        <button class="icon-btn mobile-menu" id="mobileMenu" title="打开导航">≡</button>
        <span class="env-badge" title="当前监控连接的本地 AgentLite Runtime">本地 Runtime</span>
        <input class="global-search" id="globalSearch" placeholder="搜索任务 ID、问题或 Agent..." aria-label="全局搜索">
      </div>
      <div class="top-right">
        <select class="range-select" aria-label="时间范围"><option>最近 24 小时</option><option>最近 7 天</option><option>最近 30 天</option></select>
        <span class="health-chip"><span class="health-dot"></span>系统健康 99.98%</span>
        <button class="primary-btn" data-action="new-experiment"><span>＋</span>新建实验</button>
      </div>
    </header>

    <main class="main" id="viewRoot"></main>
  </div>

  <div class="drawer-backdrop" id="drawerBackdrop"></div>
  <aside class="drawer" id="drawer" aria-hidden="true">
    <div class="drawer-head"><div><div class="drawer-title" id="drawerTitle">对象详情</div><div class="drawer-sub mono" id="drawerSub"></div></div><button class="icon-btn" data-action="close-drawer" title="关闭">×</button></div>
    <div class="drawer-tabs" id="drawerTabs"></div>
    <div class="drawer-body" id="drawerBody"></div>
  </aside>

  <div class="modal-backdrop" id="experimentModal">
    <div class="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
      <div class="modal-head"><strong id="modalTitle">新建实验任务</strong><button class="icon-btn" data-action="close-modal" title="关闭">×</button></div>
      <form id="experimentForm">
        <div class="modal-body">
          <label class="form-label">起始问题<textarea class="field" id="newQuestion" required>请分析这个多 Agent 任务，并给出可靠的协作结果。</textarea></label>
          <div class="form-row">
            <label class="form-label">运行模式<select class="field" id="newMode"><option value="runtime_lite">runtime_lite</option><option value="baseline_text">baseline_text</option></select></label>
            <label class="form-label">任务类型<select class="field" id="newGroup"><option>旅行规划</option><option>安全审计</option><option>代码分析</option><option>长上下文</option></select></label>
          </div>
          <div class="form-row">
            <label class="form-label">轮次<input class="field" id="newRounds" type="number" min="1" max="5" value="1"></label>
            <label class="form-label">优先级<select class="field" id="newPriority"><option>普通</option><option>高</option><option>低</option></select></label>
          </div>
        </div>
        <div class="modal-foot"><button type="button" class="secondary-btn" data-action="close-modal">取消</button><button type="submit" class="primary-btn">创建并模拟运行</button></div>
      </form>
    </div>
  </div>
  <div class="toast" id="toast"></div>

  <script src="/static/agentlite-live.js"></script>
</body>
</html>
