[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "multi-agent-collaboration-runtime"
version = "0.5.15.dev0"
description = "Cross-framework runtime primitives for low-overhead multi-agent collaboration"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "tiktoken>=0.13.0",
]

[project.scripts]
agentlite = "agent_runtime.cli:main"

[project.optional-dependencies]
autogen = [
  "autogen-agentchat==0.7.5",
  "autogen-core==0.7.5",
]
transformers = [
  "transformers>=5.0.0",
]

[tool.setuptools.packages.find]
include = ["agent_runtime*", "web_monitor*"]

[tool.setuptools.package-data]
web_monitor = ["demo/*"]
